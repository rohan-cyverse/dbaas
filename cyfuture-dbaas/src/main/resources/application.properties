spring.application.name=cyfuture-dbaas
server.port=8080

# Every instance must point to the same VM-hosted MySQL metadata schema.
# The complete JDBC URL (including its configurable host) is supplied by the
# environment; no application default can create a separate local metadata DB.
spring.datasource.url=${METADATA_DB_URL}
spring.datasource.username=${METADATA_DB_USERNAME}
spring.datasource.password=${METADATA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
# Existing installations that already run the pre-Flyway v6 model are
# baselined safely, then V7 performs the metadata cleanup. Fresh databases run
# V1 through V7. Legacy pre-v6 databases should set this to 2 for their one
# migration run so V3--V6 can preserve and upgrade the old tables first.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:6}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# OpenAPI and Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Background provisioning threads. Keep this small to avoid flooding Kubernetes.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50

# Leave blank to use C:/Users/<current-user>/.kube/config automatically.
# Otherwise set a path with forward slashes.
dbaas.kubeconfig=${DBAAS_KUBECONFIG:}
dbaas.namespace-prefix=dbaas-p-
dbaas.storage-class=cinder-sc

# This LoadBalancer, HAProxy Deployment and ConfigMap are installed once by
# the platform team. The application only allocates a fixed port and updates
# routes; it never creates a cloud LoadBalancer.
dbaas.gateway.namespace=dbaas-gateway
dbaas.gateway.service-name=dbaas-public-gateway
dbaas.gateway.deployment-name=dbaas-public-gateway
dbaas.gateway.config-map-name=dbaas-public-gateway-config
dbaas.gateway.reconcile-enabled=${DBAAS_GATEWAY_RECONCILE_ENABLED:false}
dbaas.gateway.port-start=31000
dbaas.gateway.port-end=31009
dbaas.gateway.public-host=${DBAAS_GATEWAY_PUBLIC_HOST:}
dbaas.gateway.reconcile-ms=10000

# Platform-owned KubeBlocks BackupRepo. The application only reads this
# existing Ready resource and references policies generated for each Cluster.
dbaas.backup.repository-name=cyfuture-dbaas-backuprepo
dbaas.backup.default-retention=7d
dbaas.backup.poll-after-seconds=5
dbaas.backup.reconcile-ms=5000
dbaas.backup.continuous-stale-ms=300000
dbaas.backup.continuous-max-gap-ms=0

# Local/Postman mode: when the request originates from loopback or a private
# LAN address, discover this machine's current public egress IP automatically.
# Set to false after deploying behind the Cyfuture.ai reverse proxy; that proxy
# must add X-Forwarded-For automatically.
dbaas.client-ip.allow-egress-fallback=true

dbaas.credential-reconcile-ms=10000
dbaas.provisioning-reconcile-ms=5000
dbaas.operation-reconcile-ms=5000
dbaas.vertical-scaling-timeout-ms=900000
dbaas.pod-update-policy-reconcile-ms=30000
dbaas.state-reconcile-ms=10000
dbaas.state.degraded-grace-ms=30000
dbaas.state.missing-grace-ms=60000

# Values verified from the installed KubeBlocks definitions.
dbaas.postgresql.cluster-definition=postgresql
dbaas.postgresql.topology=replication
dbaas.postgresql.component-name=postgresql
dbaas.postgresql.credential-account=postgres
dbaas.postgresql.credential-image=postgres:17-alpine
dbaas.postgresql.versions=18.1.0,17.5.0,16.9.0,15.13.0,14.18.0,12.22.0

dbaas.mysql.cluster-definition=mysql
dbaas.mysql.topology=semisync
dbaas.mysql.component-name=mysql
dbaas.mysql.credential-account=root
dbaas.mysql.credential-image=mysql:8.4
dbaas.mysql.versions=8.4.7,8.4.3,8.4.2,8.0.44,8.0.41,8.0.39,8.0.33,5.7.44

dbaas.mongodb.cluster-definition=mongodb
dbaas.mongodb.topology=replicaset
dbaas.mongodb.component-name=mongodb
dbaas.mongodb.credential-account=root
dbaas.mongodb.credential-image=mongo:8.0
dbaas.mongodb.versions=8.0.17,7.0.28,6.0.27,5.0.29,4.4.29
